manifest_version: 2
name: pandacode-bridge
version: 0.1.0
description: Staged decision-free signed PandaCode events for exact host-owned origins; not deploy-ready.
author: Local integration
provides_tools:
  - pandacode_bridge_launch
  - pandacode_bridge_update_brief
  - pandacode_bridge_attach
  - pandacode_bridge_act
  - pandacode_bridge_check
  - pandacode_bridge_brief
provides_hooks:
  - pre_llm_call
optional_env:
  - PANDACODE_BRIDGE_WEBHOOK_SECRET
config_schema:
  enabled:
    type: bool
    default: false
    description: Explicit opt-in; remains blocked without the reviewed host contract.
  expected_identity_contract:
    type: str
    default: ''
    description: host-origin-v1 requires the reviewed global host contract; see GLOBAL_SUPPORT.md blocking gaps.
  bind:
    type: str
    default: 127.0.0.1
    description: Loopback or an explicit local tailnet address, never a wildcard or LAN address.
  port:
    type: int
    default: 8743
    description: Signed POST /pandacode listener port.
